<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">三组离散密度反馈模型的种群轨迹</title>
  <desc id="desc">横轴为时间零至八，纵轴为种群数量。L 等于 1.3 的曲线收敛至 100，L 等于 2.3 的曲线接近二周期，L 等于 3.3 的曲线剧烈振荡并在第八步降为负值。</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <g stroke="#d9dce1" stroke-width="1">
    <line x1="90" y1="70" x2="830" y2="70"/>
    <line x1="90" y1="162.5" x2="830" y2="162.5"/>
    <line x1="90" y1="255" x2="830" y2="255"/>
    <line x1="90" y1="347.5" x2="830" y2="347.5"/>
    <line x1="90" y1="440" x2="830" y2="440"/>
  </g>
  <line x1="90" y1="162.5" x2="830" y2="162.5" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <g stroke="#2f3540" stroke-width="2">
    <line x1="90" y1="70" x2="90" y2="440"/>
    <line x1="90" y1="440" x2="830" y2="440"/>
  </g>
  <g fill="#4b5563" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="16">
    <text x="68" y="76" text-anchor="end">140</text>
    <text x="68" y="168" text-anchor="end">100</text>
    <text x="68" y="261" text-anchor="end">60</text>
    <text x="68" y="354" text-anchor="end">20</text>
    <text x="68" y="446" text-anchor="end">−20</text>
    <text x="460" y="495" text-anchor="middle">时间步 t</text>
    <text x="25" y="255" text-anchor="middle" transform="rotate(-90 25 255)">种群数量 N</text>
    <text x="838" y="156">N<tspan baseline-shift="sub" font-size="12">eq</tspan>=100</text>
  </g>
  <g fill="#4b5563" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif" font-size="15" text-anchor="middle">
    <text x="90" y="466">0</text><text x="182.5" y="466">1</text><text x="275" y="466">2</text>
    <text x="367.5" y="466">3</text><text x="460" y="466">4</text><text x="552.5" y="466">5</text>
    <text x="645" y="466">6</text><text x="737.5" y="466">7</text><text x="830" y="466">8</text>
  </g>
  <polyline points="90.0,370.6 182.5,343.6 275.0,292.5 367.5,218.5 460.0,163.3 552.5,162.3 645.0,162.6 737.5,162.5 830.0,162.5" fill="none" stroke="#2878b5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="90.0,370.6 182.5,322.8 275.0,209.6 367.5,123.3 460.0,228.7 552.5,120.0 645.0,235.7 737.5,120.6 830.0,234.4" fill="none" stroke="#d97706" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="90.0,370.6 182.5,301.9 275.0,119.3 367.5,288.6 460.0,99.4 552.5,364.3 645.0,279.5 737.5,88.8 830.0,409.7" fill="none" stroke="#b42318" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
