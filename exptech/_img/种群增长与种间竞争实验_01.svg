    <g stroke="#d97706"><circle cx="90" cy="370.6" r="4"/><circle cx="182.5" cy="322.8" r="4"/><circle cx="275" cy="209.6" r="4"/><circle cx="367.5" cy="123.3" r="4"/><circle cx="460" cy="228.7" r="4"/><circle cx="552.5" cy="120" r="4"/><circle cx="645" cy="235.7" r="4"/><circle cx="737.5" cy="120.6" r="4"/><circle cx="830" cy="234.4" r="4"/></g>
    <g stroke="#b42318"><circle cx="90" cy="370.6" r="4"/><circle cx="182.5" cy="301.9" r="4"/><circle cx="275" cy="119.3" r="4"/><circle cx="367.5" cy="288.6" r="4"/><circle cx="460" cy="99.4" r="4"/><circle cx="552.5" cy="364.3" r="4"/><circle cx="645" cy="279.5" r="4"/><circle cx="737.5" cy="88.8" r="4"/><circle cx="830" cy="409.7" r="4"/></g>
