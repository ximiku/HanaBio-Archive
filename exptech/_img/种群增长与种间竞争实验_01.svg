    <line x1="110" y1="32" x2="150" y2="32" stroke="#2878b5" stroke-width="4"/><text x="160" y="38" fill="#2f3540">L=1.3</text>
    <line x1="280" y1="32" x2="320" y2="32" stroke="#d97706" stroke-width="4"/><text x="330" y="38" fill="#2f3540">L=2.3</text>
    <line x1="450" y1="32" x2="490" y2="32" stroke="#b42318" stroke-width="4"/><text x="500" y="38" fill="#2f3540">L=3.3</text>
  </g>
</svg>
