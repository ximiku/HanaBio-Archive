name: Deploy Comment Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: comments-production
    defaults:
      run:
        working-directory: services/comments
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HANABIO_D1_DATABASE_ID: ${{ secrets.HANABIO_D1_DATABASE_ID }}
      HANABIO_GITHUB_CLIENT_ID: ${{ vars.HANABIO_GITHUB_CLIENT_ID }}
      HANABIO_ADMIN_GITHUB_IDS: ${{ vars.HANABIO_ADMIN_GITHUB_IDS }}
      HANABIO_WORKER_JWT_SECRET: ${{ secrets.HANABIO_WORKER_JWT_SECRET }}
      HANABIO_WORKER_DEPLOY_SECRET: ${{ secrets.HANABIO_WORKER_DEPLOY_SECRET }}
      HANABIO_TURNSTILE_SECRET_KEY: ${{ secrets.HANABIO_TURNSTILE_SECRET_KEY }}
      HANABIO_GITHUB_CLIENT_SECRET: ${{ secrets.HANABIO_GITHUB_CLIENT_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/comments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test worker
        run: npm test

      - name: Render temporary Wrangler config
        run: node render-config.mjs

      - name: Apply idempotent D1 schema
        run: npx wrangler d1 execute hanabio-comments --remote --file schema.sql --config wrangler.toml

      - name: Deploy worker
        run: |
          secrets_file="$RUNNER_TEMP/hanabio-comment-worker-secrets.json"
          node render-secrets.mjs "$secrets_file"
          npx wrangler deploy --config wrangler.toml --secrets-file "$secrets_file"
