name: Deploy Zensical

on:
  push:
    branches: [main]          # 只要 main 有新提交就触发
  workflow_dispatch:          # 也允许手动点按钮重新部署

permissions:
  contents: write 

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HANABIO_COMMENT_API_URL: ${{ vars.HANABIO_COMMENT_API_URL }}
      HANABIO_TURNSTILE_SITE_KEY: ${{ vars.HANABIO_TURNSTILE_SITE_KEY }}
      HANABIO_GISCUS_REPO_ID: ${{ vars.HANABIO_GISCUS_REPO_ID }}
      HANABIO_GISCUS_CATEGORY: ${{ vars.HANABIO_GISCUS_CATEGORY }}
      HANABIO_GISCUS_CATEGORY_ID: ${{ vars.HANABIO_GISCUS_CATEGORY_ID }}
      HANABIO_COMMENTS_REQUIRED: ${{ vars.HANABIO_COMMENTS_REQUIRED }}

    steps:
      # 1. 拉取源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 装 Python 并启用缓存（加速依赖安装）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-zensical.txt

      # 3. 安装当前最新版 Zensical
      - name: Install latest Zensical
        run: python -m pip install --upgrade -r requirements-zensical.txt

      - name: Show Zensical version
        run: zensical --version

      - name: Test timestamp metadata
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Git history and template contract
        run: python -m hanabio_site.checks preflight

      # 4. 使用共享的 mkdocs.yml 构建到 ./site
      - name: Build site with Zensical
        run: zensical build --clean --strict --config-file mkdocs.yml
        env:
          PYTHONPATH: .

      - name: Audit generated timestamp metadata
        run: python -m hanabio_site.checks audit --site-dir site

      - name: Prepare non-destructive comment migration
        if: ${{ vars.HANABIO_COMMENT_API_URL != '' }}
        env:
          HANABIO_COMMENT_DEPLOY_SECRET: ${{ secrets.HANABIO_COMMENT_DEPLOY_SECRET }}
        run: |
          python scripts/comment_deploy.py state --output "$RUNNER_TEMP/comment-current-revision"
          current_revision="$(tr -d '\n' < "$RUNNER_TEMP/comment-current-revision")"
          python scripts/comment_migration.py \
            --fetch-missing-from-ref \
            --from-ref "$current_revision" \
            --to-ref "$GITHUB_SHA" \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/comment-migration.json"
          python scripts/comment_deploy.py prepare --payload "$RUNNER_TEMP/comment-migration.json"

      # 5. 发布到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4          # 专门部署静态文件的官方动作
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # 内置 token，足够推分支
          publish_dir: ./site                       # 要上传的目录
          publish_branch: gh-pages                  # 目标分支
          force_orphan: true                        # 部署分支只保留最新快照

      - name: Activate comment migration
        if: ${{ vars.HANABIO_COMMENT_API_URL != '' }}
        env:
          HANABIO_COMMENT_DEPLOY_SECRET: ${{ secrets.HANABIO_COMMENT_DEPLOY_SECRET }}
        run: python scripts/comment_deploy.py activate --revision "$GITHUB_SHA"

  # 保留 MkDocs 兼容性检查；失败不会阻止 Zensical 生产部署
  mkdocs-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Git 修订日期插件需要完整历史

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install MkDocs compatibility dependencies
        run: python -m pip install -r requirements.txt

      - name: Build site with MkDocs
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/hanabio-mkdocs-site"
        env:
          PYTHONPATH: .
