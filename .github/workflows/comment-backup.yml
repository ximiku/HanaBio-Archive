name: Backup Comment Database

on:
  schedule:
    - cron: '31 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: comments-production
    defaults:
      run:
        working-directory: services/comments
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HANABIO_D1_DATABASE_ID: ${{ secrets.HANABIO_D1_DATABASE_ID }}
      HANABIO_GITHUB_CLIENT_ID: ${{ vars.HANABIO_GITHUB_CLIENT_ID }}
      HANABIO_ADMIN_GITHUB_IDS: ${{ vars.HANABIO_ADMIN_GITHUB_IDS }}
      HANABIO_COMMENT_BACKUP_KEY: ${{ secrets.HANABIO_COMMENT_BACKUP_KEY }}
      HANABIO_COMMENT_BACKUP_BUCKET: ${{ vars.HANABIO_COMMENT_BACKUP_BUCKET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/comments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Render temporary Wrangler config
        run: node render-config.mjs

      - name: Export and encrypt D1 database
        run: |
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          export_file="$RUNNER_TEMP/hanabio-comments-$stamp.sql"
          encrypted_file="$export_file.enc"
          npx wrangler d1 export hanabio-comments --remote --output "$export_file" --config wrangler.toml
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$export_file" -out "$encrypted_file" \
            -pass env:HANABIO_COMMENT_BACKUP_KEY
          npx wrangler r2 object put \
            "$HANABIO_COMMENT_BACKUP_BUCKET/comments/$(basename "$encrypted_file")" \
            --file "$encrypted_file" --remote --config wrangler.toml
